openapi: 3.0.3
info:
  title: Record Catalog Service
  description: Serves a catalog of scored records and an internal endpoint to switch between full and empty mode.
  version: 0.1.0
servers:
  - url: /
paths:
  /catalog:
    get:
      operationId: listCatalog
      summary: The current catalog of scored records
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: The records in the current catalog
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count:
                    type: integer
                    description: total matching records
                  next:
                    type: string
                    nullable: true
                    description: relative URI of the next page
                  previous:
                    type: string
                    nullable: true
                    description: relative URI of the previous page
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Record'
  /internal/catalog-mode:
    post:
      operationId: setCatalogMode
      summary: Switch the catalog between full mode and empty mode (internal operations use only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [full, empty]
                  description: the mode to switch the catalog into
      responses:
        '200':
          description: The mode now in effect
          content:
            application/json:
              schema:
                type: object
                required: [mode]
                properties:
                  mode:
                    type: string
                    enum: [full, empty]
        '400':
          description: The requested mode is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Record:
      type: object
      required: [id, name, score]
      properties:
        id:
          type: integer
          description: record identifier
        name:
          type: string
          description: record name
        score:
          type: integer
          description: record score
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: HTTP or application error code
        message:
          type: string
          description: short human-readable label
        description:
          type: string
          description: detailed explanation
        moreInfo:
          type: string
          description: URI to documentation
